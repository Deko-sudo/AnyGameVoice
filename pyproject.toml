[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anygamevoice"
version = "0.1.0"
description = "Free, open-source AI voice modding tool"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [
    {name = "AnyGameVoice Contributors"}
]
keywords = ["ai", "voice", "modding", "tts", "game-mods"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

[project.urls]
Homepage = "https://github.com/Deko-sudo/AnyGameVoice"
Repository = "https://github.com/Deko-sudo/AnyGameVoice"
Issues = "https://github.com/Deko-sudo/AnyGameVoice/issues"

[project.scripts]
anygamevoice = "app.main:main"

[tool.black]
line-length = 100
target-version = ['py310']

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
